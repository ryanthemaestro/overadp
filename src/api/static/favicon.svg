<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00ccff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- Radar sweep -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.3"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.15"/>
  <!-- Crosshairs -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>
  <line x1="6" y1="32" x2="58" y2="32" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>
  <!-- W letter -->
  <text x="32" y="42" font-family="monospace" font-size="28" font-weight="900" fill="url(#glow)" text-anchor="middle" dominant-baseline="middle">W</text>
  <!-- Dot accent -->
  <circle cx="48" cy="16" r="3" fill="#00ff88" opacity="0.8"/>
  <line x1="32" y1="32" x2="48" y2="16" stroke="#00ff88" stroke-width="0.8" opacity="0.4"/>
</svg>
